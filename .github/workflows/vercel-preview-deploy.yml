name: On-Demand Vercel Preview

on:
  push:
    branches: [codex/sandbox]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to deploy a preview for.
        required: true
        type: string
      sandbox:
        description: Assign the verified preview to sandbox.vrdex.net.
        type: boolean
        default: false
      comment_id:
        description: Issue comment id that requested the preview.
        required: false
        type: string
      head_sha:
        description: Head commit the maintainer reviewed when they requested the preview. Required for fork heads.
        required: false
        type: string
      browser_acceptance:
        description: Require exact-candidate browser/backend acceptance.
        required: false
        default: false
        type: boolean
      capture_screenshots:
        description: Capture review screenshots during browser acceptance.
        required: false
        default: false
        type: boolean
      analytics_acceptance:
        description: Enable synthetic analytics on this preview and require signed-in analytics coverage.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      pull_number:
        description: Pull request number to deploy a preview for.
        required: true
        type: string
      comment_id:
        description: Issue comment id that requested the preview.
        required: false
        type: string
      head_sha:
        description: Head commit the maintainer reviewed when they requested the preview. Required for fork heads.
        required: false
        type: string
      browser_acceptance:
        description: Require exact-candidate browser/backend acceptance.
        required: false
        default: false
        type: boolean
      capture_screenshots:
        description: Capture review screenshots during browser acceptance.
        required: false
        default: false
        type: boolean
      analytics_acceptance:
        description: Enable synthetic analytics and require signed-in analytics coverage.
        required: false
        default: false
        type: boolean
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_SANDBOX_PROJECT_ID:
        required: false
      VRDEX_SANDBOX_EVENT_OUTPUT_BROKER_TOKEN:
        required: false
      VRDEX_SANDBOX_EVENT_MEDIA_BRIDGE_TOKEN:
        required: false
      CONVEX_DEPLOY_KEY_PREVIEW:
        required: false
      CLERK_JWT_ISSUER_DOMAIN:
        required: false
      VRDEX_HOSTED_E2E_BROWSER_TOKEN:
        required: false
      VRDEX_HOSTED_E2E_CLERK_PUBLISHABLE_KEY:
        required: false
      VRDEX_HOSTED_E2E_CLERK_SECRET_KEY:
        required: false
    outputs:
      deployment_url:
        description: Preview deployment URL.
        value: ${{ jobs.deploy-preview.outputs.deployment_url }}

permissions:
  contents: read
  pull-requests: read

# Keep deployment and its consumers in one group. Manual refreshes replace old
# manual runs; acceptance queues so a backend writer finishes before reuse.
concurrency:
  group: ${{ (inputs.sandbox || github.ref == 'refs/heads/codex/sandbox') && 'vrdex-sandbox-alias' || format('on-demand-vercel-preview-{0}-{1}-{2}', inputs.pull_number, inputs.browser_acceptance && 'acceptance' || 'manual', github.event_name) }}
  cancel-in-progress: ${{ !inputs.browser_acceptance && !inputs.sandbox && github.ref != 'refs/heads/codex/sandbox' }}

jobs:
  deploy-preview:
    name: Deploy On-Demand Preview
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      preview_name: ${{ steps.pr.outputs.preview_name }}
      e2e_auth_enabled: ${{ steps.deploy.outputs.e2e_auth_enabled }}
      convex_preview_enabled: ${{ steps.convex-preview-gate.outputs.enabled }}
      convex_preview_url: ${{ steps.convex-preview.outputs.convex_url }}
      deployment_url: ${{ steps.deploy.outputs.url }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      is_fork: ${{ steps.pr.outputs.is_fork }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      sandbox: ${{ steps.pr.outputs.sandbox }}

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v9
        env:
          BROWSER_ACCEPTANCE: ${{ inputs.browser_acceptance }}
          ANALYTICS_ACCEPTANCE: ${{ inputs.analytics_acceptance }}
          SANDBOX: ${{ github.event_name == 'workflow_dispatch' && inputs.sandbox }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_PULL_NUMBER: ${{ inputs.pull_number }}
        with:
          script: |
            if (process.env.ANALYTICS_ACCEPTANCE === "true" && process.env.BROWSER_ACCEPTANCE !== "true") {
              core.setFailed("analytics_acceptance requires browser_acceptance.");
              return;
            }
            if (context.eventName === "push") {
              if (context.ref !== "refs/heads/codex/sandbox" || context.payload.repository.id !== 1176245711
                  || !/^[a-f0-9]{40}$/.test(context.sha)) {
                core.setFailed("Shared sandbox deploys require the trusted codex/sandbox branch and an exact commit.");
                return;
              }
              core.setOutput("sandbox", "true");
              core.setOutput("is_fork", "false");
              core.setOutput("head_sha", context.sha);
              core.setOutput("head_ref", "codex/sandbox");
              core.setOutput("pr_number", "");
              core.setOutput("preview_name", "sandbox-shared");
              return;
            }
            core.setOutput("sandbox", process.env.SANDBOX === "true" ? "true" : "false");
            const raw = String(process.env.INPUT_PULL_NUMBER || "").trim();
            const pullNumber = Number(raw);
            if (!Number.isInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed("pull_number must be a positive integer.");
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            const isFork = pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;
            core.setOutput('is_fork', isFork ? 'true' : 'false');
            if (process.env.SANDBOX === "true" && (context.payload.repository.id !== 1176245711
                || isFork || process.env.BROWSER_ACCEPTANCE === "true" || !process.env.INPUT_HEAD_SHA?.trim())) {
              core.setFailed("The sandbox requires a pinned same-repository manual preview.");
              return;
            }
            if (isFork) {
              core.notice(`Fork head ${pull.head.repo?.full_name}@${pull.head.sha}: hosted E2E helpers withheld.`);
            }
            if (isFork && process.env.BROWSER_ACCEPTANCE === "true") {
              core.setFailed("Private browser acceptance is unavailable for fork heads. Request a manual preview without browser acceptance.");
              return;
            }

            if (pull.state !== "open") {
              core.setFailed(
                `On-demand previews only run for open pull requests. This one is ${pull.state}.`,
              );
              return;
            }

            // Pin the selection snapshot. Fork requests require a maintainer-reviewed
            // SHA; same-repository browser selection supplies its event head.
            const requestedSha = String(process.env.INPUT_HEAD_SHA || "").trim();
            if (isFork && !requestedSha) {
              core.setFailed(
                "Fork heads require the reviewed head_sha; trigger the preview with the @vrdex preview comment.",
              );
              return;
            }
            if (requestedSha && requestedSha !== pull.head.sha) {
              core.setFailed(
                `Head moved since the request (${requestedSha} vs ${pull.head.sha}); re-review and re-trigger.`,
              );
              return;
            }

            const purpose = context.eventName === "pull_request" ? "ci" : "manual-accept";
            core.setOutput("preview_name", process.env.SANDBOX === "true" ? `sandbox-pr-${pull.number}`
              : process.env.BROWSER_ACCEPTANCE === "true" ? `${purpose}-pr-${pull.number}` : `pr-${pull.number}`);
            core.setOutput("head_sha", requestedSha || pull.head.sha);
            core.setOutput("head_ref", pull.head.ref);
            core.setOutput("pr_number", String(pull.number));

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Check Vercel deployment secrets
        env:
          SANDBOX_REQUESTED: ${{ steps.pr.outputs.sandbox }}
          DEDICATED_SANDBOX_CONFIGURED: ${{ secrets.VERCEL_SANDBOX_PROJECT_ID != '' }}
          SHARED_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ github.event_name == 'push' && steps.pr.outputs.sandbox == 'true' && secrets.VERCEL_SANDBOX_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ "$SANDBOX_REQUESTED" = "true" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$DEDICATED_SANDBOX_CONFIGURED" != "true" ]; then
              echo "::error::A shared sandbox push requires VERCEL_SANDBOX_PROJECT_ID."
              exit 1
            fi
            echo "Deploy target: dedicated vr-dex-sandbox preview project." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$SANDBOX_REQUESTED" = "true" ] && [ "$DEDICATED_SANDBOX_CONFIGURED" = "true" ] && [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "::error::The dedicated sandbox project accepts pushes from codex/sandbox only."
            exit 1
          fi
          if [ "$SANDBOX_REQUESTED" = "true" ] && [ "$DEDICATED_SANDBOX_CONFIGURED" = "true" ] && [ "$VERCEL_PROJECT_ID" = "$SHARED_PROJECT_ID" ]; then
            echo "::error::The sandbox and shared preview Vercel projects must be different."
            exit 1
          fi

          missing=()
          if [ -z "$VERCEL_TOKEN" ]; then missing+=("VERCEL_TOKEN"); fi
          if [ -z "$VERCEL_ORG_ID" ]; then missing+=("VERCEL_ORG_ID"); fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then missing+=("VERCEL_PROJECT_ID"); fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing repository secrets for on-demand previews: %s\n' "${missing[*]}"
            exit 1
          fi

          if [ "$SANDBOX_REQUESTED" = "true" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            curl -fsS --max-time 15 --get \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              --data-urlencode "teamId=$VERCEL_ORG_ID" --data-urlencode "decrypt=false" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" \
              | jq -e 'any(.envs[]; .key == "CONVEX_ADMIN_TOKEN" and .type == "sensitive" and .target == ["preview"] and (.gitBranch == null))' >/dev/null \
              || { echo "::error::Configure the scoped CONVEX_ADMIN_TOKEN as a sensitive variable in the dedicated preview project."; exit 1; }
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ github.event_name == 'push' && steps.pr.outputs.sandbox == 'true' && secrets.VERCEL_SANDBOX_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@54.4.1 pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Check Convex preview deploy key
        id: convex-preview-gate
        env:
          CONVEX_DEPLOY_KEY_PREVIEW: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY_PREVIEW" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Convex preview deploy"
              echo "Skipped because CONVEX_DEPLOY_KEY_PREVIEW is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # This evaluates `convex/auth.config.ts`, which reads
      # CLERK_JWT_ISSUER_DOMAIN on any hosted deployment, so the variable must
      # already exist on a newly created preview. The CLI cannot seed it — there
      # is no `--env` on `convex deploy`, and `convex env set` needs the
      # deployment to exist — so it has to come from the project's preview
      # environment-variable defaults in the Convex dashboard. See
      # docs/deployment/convex-environments.md.
      - name: Authorize the pinned shared sandbox backend
        id: sandbox-backend
        if: github.event_name == 'push' && steps.pr.outputs.sandbox == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          PREVIEW_NAME: ${{ steps.pr.outputs.preview_name }}
          EXPECTED_CONVEX_PREVIEW_URL: ${{ vars.VRDEX_SANDBOX_CONVEX_URL || 'https://quick-yak-167.convex.cloud' }}
        run: node scripts/capture-preview-runtime-credential.mjs

      - name: Deploy Convex preview functions
        if: steps.convex-preview-gate.outputs.enabled == 'true'
        id: convex-preview
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          PREVIEW_NAME: ${{ steps.pr.outputs.preview_name }}
          REUSE_SANDBOX: ${{ github.event_name == 'push' && steps.pr.outputs.sandbox == 'true' }}
          VRDEX_PREVIEW_BACKEND_URL: ${{ vars.VRDEX_SANDBOX_CONVEX_URL || 'https://quick-yak-167.convex.cloud' }}
          VRDEX_PREVIEW_DEPLOYMENT_KEY: ${{ steps.sandbox-backend.outputs.deployment_key }}
        run: |
          set -euo pipefail
          if [ "$REUSE_SANDBOX" = "true" ]; then
            : "${VRDEX_PREVIEW_DEPLOYMENT_KEY:?Existing sandbox credential is required.}"
            pnpm exec convex deploy --url "$VRDEX_PREVIEW_BACKEND_URL" --admin-key "$VRDEX_PREVIEW_DEPLOYMENT_KEY" --yes --typecheck=enable --cmd "node scripts/write-convex-preview-output.mjs" --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
          else
            pnpm exec convex deploy --yes --typecheck=enable --preview-create "$PREVIEW_NAME" --cmd "node scripts/write-convex-preview-output.mjs" --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
          fi

      - name: Configure Convex preview runtime and smoke fixture
        if: steps.convex-preview.outputs.convex_url != ''
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          HOSTED_E2E_AUTH_HELPERS: ${{ steps.pr.outputs.sandbox != 'true' && steps.pr.outputs.is_fork == 'false' && vars.VRDEX_HOSTED_E2E_AUTH_HELPERS || '' }}
          HOSTED_E2E_BROWSER_TOKEN: ${{ steps.pr.outputs.sandbox != 'true' && steps.pr.outputs.is_fork == 'false' && secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN || '' }}
          HOSTED_E2E_DEVELOPER_CREDENTIALS: ${{ steps.pr.outputs.sandbox != 'true' && steps.pr.outputs.is_fork == 'false' && vars.VRDEX_HOSTED_E2E_DEVELOPER_CREDENTIALS || '' }}
          PREVIEW_NAME: ${{ steps.pr.outputs.preview_name }}
        run: |
          set -euo pipefail
          bridge_secret=$(openssl rand -hex 32)
          echo "::add-mask::$bridge_secret"
          echo "VRDEX_PREVIEW_PERSISTENCE_SECRET=$bridge_secret" >> "$GITHUB_ENV"
          printf '%s' preview | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_DEPLOYMENT_ENV
          printf '%s' true | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_PREVIEW_PERSISTENCE_BRIDGE
          printf '%s' true | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_HOSTED_SMOKE_FIXTURE
          printf '%s' "$bridge_secret" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_PREVIEW_PERSISTENCE_SECRET

          preview_e2e_auth_enabled=false
          if [ "$HOSTED_E2E_AUTH_HELPERS" = "true" ] && [ -n "$HOSTED_E2E_BROWSER_TOKEN" ]; then
            e2e_convex_secret=$(openssl rand -hex 32)
            node scripts/generate-preview-developer-runtime-secrets.mjs
            echo "::add-mask::$e2e_convex_secret"
            echo "VRDEX_PREVIEW_E2E_CONVEX_SECRET=$e2e_convex_secret" >> "$GITHUB_ENV"
            printf '%s' true | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_E2E_HELPERS
            printf '%s' true | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_E2E_AUTH_HELPERS
            developer_bridge=false
            if [ "$HOSTED_E2E_DEVELOPER_CREDENTIALS" = "true" ]; then developer_bridge=true; fi
            printf '%s' "$developer_bridge" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_PREVIEW_OAUTH_TOKEN_BRIDGE
            printf '%s' "$e2e_convex_secret" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_E2E_CONVEX_SECRET
            # Clerk signs the tokens Convex trusts, so the preview no longer mints
            # its own RS256 pair. Authenticated preview flows need a Clerk instance
            # and CLERK_JWT_ISSUER_DOMAIN below; see #226.
            preview_e2e_auth_enabled=true
          else
            printf '%s' false | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_E2E_HELPERS
            printf '%s' false | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_E2E_AUTH_HELPERS
            printf '%s' false | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_PREVIEW_OAUTH_TOKEN_BRIDGE
          fi
          echo "VRDEX_PREVIEW_E2E_AUTH_ENABLED=$preview_e2e_auth_enabled" >> "$GITHUB_ENV"

          pnpm exec convex run --preview-name "$PREVIEW_NAME" hostedSmokeFixtures:ensurePublicSearchFixture

      - name: Bind optional sandbox broadcast bootstrap credentials
        if: github.event_name == 'push' && steps.pr.outputs.sandbox == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          PREVIEW_NAME: ${{ steps.pr.outputs.preview_name }}
          EXPECTED_CONVEX_PREVIEW_URL: ${{ vars.VRDEX_SANDBOX_CONVEX_URL || 'https://quick-yak-167.convex.cloud' }}
          CONVEX_PREVIEW_URL: ${{ steps.convex-preview.outputs.convex_url }}
          BROKER_TOKEN: ${{ secrets.VRDEX_SANDBOX_EVENT_OUTPUT_BROKER_TOKEN }}
          BRIDGE_TOKEN: ${{ secrets.VRDEX_SANDBOX_EVENT_MEDIA_BRIDGE_TOKEN }}
        run: |
          set -euo pipefail
          test "$PREVIEW_NAME" = sandbox-shared
          test "$CONVEX_PREVIEW_URL" = "$EXPECTED_CONVEX_PREVIEW_URL"
          if [ -z "$BROKER_TOKEN" ] && [ -z "$BRIDGE_TOKEN" ]; then exit 0; fi
          : "${BROKER_TOKEN:?Sandbox broker token is required.}" "${BRIDGE_TOKEN:?Sandbox dispatcher token is required.}"
          printf '%s' "$BROKER_TOKEN" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_EVENT_OUTPUT_BROKER_TOKEN
          printf '%s' "$BRIDGE_TOKEN" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_EVENT_MEDIA_BRIDGE_TOKEN
          printf '%s' vrdex/sandbox/broadcast/ | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_EVENT_OUTPUT_SECRET_NAMESPACE
          printf '%s' arn:aws:secretsmanager:us-east-1:079358094174:secret: | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_EVENT_OUTPUT_SECRET_ARN_PREFIX
          printf '%s' 1 | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_EVENT_BROADCAST_MAX_CONCURRENT

      - name: Use Convex preview URL for Vercel build
        if: steps.convex-preview.outputs.convex_url != ''
        env:
          CONVEX_PREVIEW_URL: ${{ steps.convex-preview.outputs.convex_url }}
        run: |
          echo "NEXT_PUBLIC_CONVEX_URL=$CONVEX_PREVIEW_URL" >> "$GITHUB_ENV"
          echo "CONVEX_URL=$CONVEX_PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Configure synthetic analytics acceptance
        if: inputs.analytics_acceptance
        run: |
          sed -i -E '/^NEXT_PUBLIC_POSTHOG_(FOUNDATION_ENABLED|LIMITED_ENABLED|KEY|DEPLOYMENT_CATEGORY)=/d' .vercel/.env.preview.local
          printf '\n' >> .vercel/.env.preview.local
          cat <<'ENV' | tee -a "$GITHUB_ENV" .vercel/.env.preview.local > /dev/null
          NEXT_PUBLIC_POSTHOG_FOUNDATION_ENABLED=true
          NEXT_PUBLIC_POSTHOG_LIMITED_ENABLED=false
          NEXT_PUBLIC_POSTHOG_KEY=phc_synthetic_analytics_acceptance
          NEXT_PUBLIC_POSTHOG_DEPLOYMENT_CATEGORY=preview
          ENV

      - name: Generate sandbox OAuth runtime
        if: github.event_name == 'push' && steps.pr.outputs.sandbox == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          PREVIEW_NAME: ${{ steps.pr.outputs.preview_name }}
        run: node scripts/generate-preview-developer-runtime-secrets.mjs --reuse-sandbox

      - name: Build Vercel preview output
        env:
          SHARED_SANDBOX: ${{ github.event_name == 'push' && steps.pr.outputs.sandbox == 'true' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ github.event_name == 'push' && steps.pr.outputs.sandbox == 'true' && secrets.VERCEL_SANDBOX_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ "$SHARED_SANDBOX" = "true" ]; then
            sed -i -E '/^CONVEX_ADMIN_TOKEN=/d' .vercel/.env.preview.local
          fi
          pnpm dlx vercel@54.4.1 build --target=preview --token "$VERCEL_TOKEN"

      - name: Deploy Vercel preview output
        id: deploy
        env:
          SANDBOX: ${{ steps.pr.outputs.sandbox }}
          SHARED_SANDBOX: ${{ github.event_name == 'push' && steps.pr.outputs.sandbox == 'true' }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          CONVEX_PREVIEW_URL: ${{ steps.convex-preview.outputs.convex_url }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PREVIEW_NAME: ${{ steps.pr.outputs.preview_name }}
          VRDEX_E2E_BROWSER_TOKEN: ${{ steps.pr.outputs.sandbox != 'true' && steps.pr.outputs.is_fork == 'false' && secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ github.event_name == 'push' && steps.pr.outputs.sandbox == 'true' && secrets.VERCEL_SANDBOX_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deploy_args=(deploy --prebuilt --target=preview --token "$VERCEL_TOKEN")
          if [ -n "$CONVEX_PREVIEW_URL" ]; then
            : "${VRDEX_PREVIEW_PERSISTENCE_SECRET:?Preview persistence secret was not configured.}"
            deploy_args+=(
              --env "CONVEX_URL=$CONVEX_PREVIEW_URL"
              --env "VRDEX_DEPLOYMENT_ENV=preview"
              --env "VRDEX_ENABLE_PREVIEW_PERSISTENCE_BRIDGE=true"
              --env "VRDEX_PREVIEW_PERSISTENCE_SECRET=$VRDEX_PREVIEW_PERSISTENCE_SECRET"
            )
          fi
          if [ "$SANDBOX" = "true" ]; then
            deploy_args+=(
              --env "VRDEX_ENABLE_E2E_HELPERS=false"
              --env "VRDEX_ENABLE_E2E_AUTH_HELPERS=false"
              --env "VRDEX_ENABLE_E2E_ADAPTER_HELPERS=false"
            )
          fi
          if [ "${VRDEX_PREVIEW_E2E_AUTH_ENABLED:-false}" = "true" ]; then
            : "${VRDEX_PREVIEW_E2E_CONVEX_SECRET:?Preview E2E Convex secret was not configured.}"
            : "${VRDEX_E2E_BROWSER_TOKEN:?Preview E2E browser token was not configured.}"
            api_token_pepper=$(<.tmp-gh-artifacts/preview-developer-runtime/api-token-pepper)
            oauth_access_token_signing_key=$(<.tmp-gh-artifacts/preview-developer-runtime/oauth-access-token-signing-key)
            oauth_client_secret_pepper=$(<.tmp-gh-artifacts/preview-developer-runtime/oauth-client-secret-pepper)
            oauth_refresh_token_pepper=$(<.tmp-gh-artifacts/preview-developer-runtime/oauth-refresh-token-pepper)
            echo "::add-mask::$api_token_pepper"
            echo "::add-mask::$oauth_access_token_signing_key"
            echo "::add-mask::$oauth_client_secret_pepper"
            echo "::add-mask::$oauth_refresh_token_pepper"
            deploy_args+=(
              --env "VRDEX_ENABLE_E2E_HELPERS=true"
              --env "VRDEX_ENABLE_E2E_AUTH_HELPERS=true"
              --env "VRDEX_E2E_BROWSER_TOKEN=$VRDEX_E2E_BROWSER_TOKEN"
              --env "VRDEX_E2E_CONVEX_SECRET=$VRDEX_PREVIEW_E2E_CONVEX_SECRET"
              --env "VRDEX_API_TOKEN_PEPPER=$api_token_pepper"
              --env "VRDEX_OAUTH_ACCESS_TOKEN_SIGNING_KEY=$oauth_access_token_signing_key"
              --env "VRDEX_OAUTH_ACCESS_TOKEN_SIGNING_KID=vrdex-pr-$PR_NUMBER"
              --env "VRDEX_OAUTH_CLIENT_SECRET_PEPPER=$oauth_client_secret_pepper"
              --env "VRDEX_OAUTH_REFRESH_TOKEN_PEPPER=$oauth_refresh_token_pepper"
            )
          fi
          if [ "$SHARED_SANDBOX" = "true" ]; then
            for setting in \
              "VRDEX_API_TOKEN_PEPPER:api-token-pepper" \
              "VRDEX_OAUTH_ACCESS_TOKEN_SIGNING_KEY:oauth-access-token-signing-key" \
              "VRDEX_OAUTH_CLIENT_SECRET_PEPPER:oauth-client-secret-pepper" \
              "VRDEX_OAUTH_REFRESH_TOKEN_PEPPER:oauth-refresh-token-pepper"; do
              value=$(<".tmp-gh-artifacts/preview-developer-runtime/${setting#*:}")
              : "${value:?Sandbox OAuth secret was not generated.}"
              echo "::add-mask::$value"
              deploy_args+=(--env "${setting%%:*}=$value")
            done
            deploy_args+=(--env "VRDEX_OAUTH_ACCESS_TOKEN_SIGNING_KID=vrdex-sandbox")
          fi
          deployment_url=$(pnpm dlx vercel@54.4.1 "${deploy_args[@]}" | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo "Vercel preview deployment did not return a URL." >&2
            exit 1
          fi
          if [ "${VRDEX_PREVIEW_E2E_AUTH_ENABLED:-false}" = "true" ]; then
            printf '%s' "$deployment_url" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" SITE_URL
            # Redundant on the create path, which seeds it via `--env`, but keeps
            # an existing preview in sync when the secret rotates.
            if [ -n "${CLERK_JWT_ISSUER_DOMAIN:-}" ]; then
              printf '%s' "$CLERK_JWT_ISSUER_DOMAIN" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" CLERK_JWT_ISSUER_DOMAIN
            fi
          fi

          echo "e2e_auth_enabled=${VRDEX_PREVIEW_E2E_AUTH_ENABLED:-false}" >> "$GITHUB_OUTPUT"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "## On-demand Vercel preview"
            if [ -n "$PR_NUMBER" ]; then echo "- Pull request: #$PR_NUMBER"; fi
            echo "- Ref: \`$HEAD_REF\`"
            echo "- Commit: \`$HEAD_SHA\`"
            echo "- Deployment: $deployment_url"
            echo "- Deployment identity: $deployment_url/api/deployment"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Assign the sandbox domain
        if: steps.pr.outputs.sandbox == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          CONVEX_PREVIEW_URL: ${{ steps.convex-preview.outputs.convex_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ github.event_name == 'push' && steps.pr.outputs.sandbox == 'true' && secrets.VERCEL_SANDBOX_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${CONVEX_PREVIEW_URL:?The sandbox requires its own Convex preview}"
          verify_preview() {
            curl -fsS --max-time 15 "$1/api/deployment" |
              jq -e --arg sha "$HEAD_SHA" --arg backend "$CONVEX_PREVIEW_URL" '
                .commit == $sha and .environment == "preview" and
                .convexBrowser == $backend and .convexServer == $backend and
                .e2eHelpersEnabled == false and (.clerkFrontendApi | endswith(".clerk.accounts.dev"))' >/dev/null
          }
          verify_preview "$DEPLOYMENT_URL"
          pnpm dlx vercel@54.4.1 alias set "$DEPLOYMENT_URL" sandbox.vrdex.net --token "$VERCEL_TOKEN"
          for attempt in {1..12}; do
            if verify_preview https://sandbox.vrdex.net; then
              echo "- Sandbox: https://sandbox.vrdex.net/events/new" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Sandbox domain did not serve the selected preview."
          exit 1


  preview-comments:
    name: Report Manual Preview
    timeout-minutes: 5
    needs: [deploy-preview]
    if: always() && !inputs.browser_acceptance && needs.deploy-preview.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Non-fatal: a live preview must not be reported as a failed deploy just
      # because the comment API call did not land.
      - name: Post preview comment
        if: needs.deploy-preview.result == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ inputs.comment_id }}
          DEPLOYMENT_URL: ${{ needs.deploy-preview.outputs.deployment_url }}
          HEAD_REF: ${{ needs.deploy-preview.outputs.head_ref }}
          HEAD_SHA: ${{ needs.deploy-preview.outputs.head_sha }}
          IS_FORK: ${{ needs.deploy-preview.outputs.is_fork }}
          PR_NUMBER: ${{ needs.deploy-preview.outputs.pr_number }}
        with:
          script: |
            const marker = "<!-- on-demand-vercel-preview-comment -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const isFork = process.env.IS_FORK === "true";

            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "## On-demand Vercel preview",
              `Branch \`${process.env.HEAD_REF}\` at \`${process.env.HEAD_SHA}\`${isFork ? " (fork head; hosted E2E lane skipped)" : ""}`,
              `Preview URL: ${deploymentUrl}`,
              `Deployment identity: ${deploymentUrl}/api/deployment`,
              "",
              isFork
                ? "Hosted MCP preview smoke is skipped for fork heads; it needs the hosted end-to-end credentials this build runs without."
                : `Hosted MCP preview smoke runs after this deploy in the same run: ${runUrl}`,
              "Open the linked workflow run to read the manual preview smoke result.",
              "",
              "Comment `@vrdex preview` or `/vercel-preview` on this pull request for a fresh deployment.",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            const commentId = Number(process.env.COMMENT_ID || "0");
            if (commentId > 0) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner,
                  repo,
                  comment_id: commentId,
                  content: "rocket",
                });
              } catch (error) {
                core.warning(`Unable to add success reaction: ${error}`);
              }
            }

      - name: Report failure on pull request
        if: needs.deploy-preview.result == 'failure'
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ inputs.comment_id }}
          PR_NUMBER: ${{ needs.deploy-preview.outputs.pr_number }}
        with:
          script: |
            const marker = "<!-- on-demand-vercel-preview-failure-comment -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "On-demand Vercel preview deploy failed.",
              `Workflow logs: ${runUrl}`,
            ].join("\n");

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find(
                (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
              );

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (error) {
              core.warning(`Unable to post failure comment: ${error}`);
            }

            const commentId = Number(process.env.COMMENT_ID || "0");
            if (commentId > 0) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner,
                  repo,
                  comment_id: commentId,
                  content: "confused",
                });
              } catch (error) {
                core.warning(`Unable to add failure reaction: ${error}`);
              }
            }

  candidate-browser-acceptance:
    name: Candidate Browser and Backend Acceptance
    permissions:
      contents: read
      pull-requests: read
    needs: [deploy-preview]
    if: inputs.browser_acceptance && needs.deploy-preview.outputs.is_fork == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_PREVIEW_NAME: ${{ needs.deploy-preview.outputs.preview_name }}
      CANDIDATE_HEAD_SHA: ${{ needs.deploy-preview.outputs.head_sha }}
      CANDIDATE_CONVEX_URL: ${{ needs.deploy-preview.outputs.convex_preview_url }}
      PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.deployment_url }}
      PLAYWRIGHT_SKIP_WEBSERVERS: "true"
      PLAYWRIGHT_CAPTURE_SCREENSHOTS: ${{ inputs.capture_screenshots }}
      PLAYWRIGHT_RECORD_VIDEO: "true"
      VRDEX_ENABLE_E2E_AUTH_HELPERS: ${{ needs.deploy-preview.outputs.e2e_auth_enabled }}
      VRDEX_ENABLE_E2E_CLERK_AUTH: ${{ vars.VRDEX_HOSTED_E2E_CLERK_AUTH }}
      VRDEX_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_SECRET_KEY }}
      VRDEX_E2E_RUN_ID: candidate-${{ needs.deploy-preview.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
      VRDEX_ANALYTICS_ACCEPTANCE: ${{ inputs.analytics_acceptance }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.deploy-preview.outputs.head_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify candidate identity before mutations
        run: node scripts/candidate-preview-acceptance.mjs preflight
      - name: Install Chromium
        working-directory: apps/web
        timeout-minutes: 10
        run: |
          sudo "$(command -v node)" "${{ github.workspace }}/.github/scripts/configure-ubuntu-mirror.mjs"
          pnpm exec playwright install --with-deps chromium
      - name: Profile mutation, public readback and owned cleanup
        working-directory: apps/web
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results-candidate-mutation
          PLAYWRIGHT_HTML_REPORT_DIR: playwright-report-candidate-mutation
          PLAYWRIGHT_JSON_REPORT_FILE: playwright-artifacts/candidate-mutation.json
        run: pnpm exec playwright test profile-submission.flow.spec.ts --grep "profile submission writes through to public profile and discovery" --project=desktop-chromium
      - name: Development-instance auth on desktop and mobile
        working-directory: apps/web
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results-candidate-auth
          PLAYWRIGHT_HTML_REPORT_DIR: playwright-report-candidate-auth
          PLAYWRIGHT_JSON_REPORT_FILE: playwright-artifacts/candidate-auth.json
        run: pnpm exec playwright test auth-session.flow.spec.ts --project=desktop-chromium --project=mobile-chromium
      - name: Account assertions and selected captures on desktop and mobile
        working-directory: apps/web
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results-candidate-account
          PLAYWRIGHT_HTML_REPORT_DIR: playwright-report-candidate-account
          PLAYWRIGHT_JSON_REPORT_FILE: playwright-artifacts/candidate-account.json
        run: pnpm test:e2e:hosted:account-visual
      - name: Verify selected screenshot coverage
        run: node .github/scripts/visual-ci.cjs --check-captures apps/web/playwright-artifacts/screenshots
      - name: Verify executed coverage and recheck deployment identity
        run: node scripts/candidate-preview-acceptance.mjs report
      - name: Reject evidence for a superseded PR head
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.deploy-preview.outputs.pr_number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(process.env.PR_NUMBER) });
            if (pr.head.sha !== process.env.CANDIDATE_HEAD_SHA) core.setFailed("Candidate head changed during acceptance; run again for the new head.");
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-hosted-data-flow
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/web/playwright-artifacts/
            apps/web/test-results-candidate-*/
            apps/web/playwright-report-candidate-*/

  hosted-mcp-preview-smoke:
    name: Hosted MCP Preview Smoke
    needs: [deploy-preview]
    # Gate on a real deployment URL rather than the aggregate job result, so a
    # deploy that succeeded but whose comment step failed is still smoked, and a
    # deploy that produced no URL is correctly skipped.
    if: ${{ !cancelled() && !inputs.browser_acceptance && needs.deploy-preview.outputs.sandbox != 'true' && needs.deploy-preview.outputs.deployment_url != '' && needs.deploy-preview.outputs.is_fork == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.deploy-preview.outputs.head_sha }}

      - name: Check hosted MCP smoke target
        id: gate
        env:
          CONVEX_PREVIEW_ENABLED: ${{ needs.deploy-preview.outputs.convex_preview_enabled }}
          CONVEX_PREVIEW_URL: ${{ needs.deploy-preview.outputs.convex_preview_url }}
          DEPLOYMENT_URL: ${{ needs.deploy-preview.outputs.deployment_url }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYMENT_URL" ]; then
            {
              echo "## Hosted MCP preview smoke"
              echo "Failed because the Vercel preview deployment URL is unavailable."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$CONVEX_PREVIEW_ENABLED" != "true" ] || [ -z "$CONVEX_PREVIEW_URL" ]; then
            {
              echo "## Hosted MCP preview smoke"
              echo "Failed because a same-branch Convex preview backend is unavailable."
              echo ""
              echo "Set repository secret CONVEX_DEPLOY_KEY_PREVIEW so this smoke covers data-backed public reads, Dynamic Client Registration, and Client ID Metadata Document authorization."
              echo "Target was $DEPLOYMENT_URL/mcp."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "mcp_url=$DEPLOYMENT_URL/mcp" >> "$GITHUB_OUTPUT"
          {
            echo "## Hosted MCP preview smoke"
            echo "Running hosted MCP preview smoke with data-backed public reads, Dynamic Client Registration, and Client ID Metadata Document authorization against a same-branch Convex preview backend."
            echo ""
            echo "Target is $DEPLOYMENT_URL/mcp."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run hosted MCP smoke
        env:
          VRDEX_MCP_SMOKE_CONTINUE_ON_FAILURE: "true"
          VRDEX_MCP_SMOKE_CIMD: "true"
          VRDEX_MCP_SMOKE_DCR: "true"
          VRDEX_MCP_SMOKE_DATA: "true"
          VRDEX_MCP_SMOKE_URL: ${{ steps.gate.outputs.mcp_url }}
        run: pnpm smoke:mcp-compat

      # This workflow is dispatched, so its jobs never appear as pull request status
      # checks. Without this step a failed smoke is invisible on the pull request,
      # sitting under an already-posted success comment for the deploy.
      - name: Report smoke failure on pull request
        if: failure() && needs.deploy-preview.outputs.pr_number != ''
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ inputs.comment_id }}
          DEPLOYMENT_URL: ${{ needs.deploy-preview.outputs.deployment_url }}
          PR_NUMBER: ${{ needs.deploy-preview.outputs.pr_number }}
        with:
          script: |
            const marker = "<!-- on-demand-vercel-preview-smoke-failure-comment -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "## Hosted MCP preview smoke failed",
              `Target: ${process.env.DEPLOYMENT_URL}/mcp`,
              `Workflow logs: ${runUrl}`,
              "",
              "The preview deployed, so the preview comment above is still accurate. Hosted MCP evidence for this commit is failing: data-backed public reads, Dynamic Client Registration, or Client ID Metadata Document authorization did not pass.",
            ].join("\n");

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find(
                (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
              );

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (error) {
              core.warning(`Unable to post smoke failure comment: ${error}`);
            }

            const commentId = Number(process.env.COMMENT_ID || "0");
            if (commentId > 0) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner,
                  repo,
                  comment_id: commentId,
                  content: "confused",
                });
              } catch (error) {
                core.warning(`Unable to add smoke failure reaction: ${error}`);
              }
            }

      # A passing rerun must retire the failure comment above, or the pull request
      # keeps showing a stale failure that points at an older run.
      - name: Clear prior smoke failure comment
        if: success() && needs.deploy-preview.outputs.pr_number != ''
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_URL: ${{ needs.deploy-preview.outputs.deployment_url }}
          PR_NUMBER: ${{ needs.deploy-preview.outputs.pr_number }}
        with:
          script: |
            const marker = "<!-- on-demand-vercel-preview-smoke-failure-comment -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find(
                (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
              );

              if (!existing) {
                return;
              }

              const body = [
                marker,
                "## Hosted MCP preview smoke passed",
                `Target: ${process.env.DEPLOYMENT_URL}/mcp`,
                `Workflow logs: ${runUrl}`,
                "",
                "A later run passed, so the earlier smoke failure recorded in this comment is resolved.",
              ].join("\n");

              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } catch (error) {
              core.warning(`Unable to clear smoke failure comment: ${error}`);
            }
